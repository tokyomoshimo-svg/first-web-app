<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#bfe3ff">
  <meta name="description" content="小さな3Dの東京を、スマホでただ歩いてみる。">
  <title>東京、歩く。｜ちょっと暇つぶし。</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏙️</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body class="tw-body">
  <div class="tw-app" id="tw-app" data-state="loading">
    <canvas class="tw-canvas" id="tw-canvas" aria-label="3Dの東京の街"></canvas>

    <!-- 常に表示：サイトへ戻る・タイトルバッジ -->
    <a class="tw-back" href="../../">← ちょっと暇つぶし。</a>
    <p class="tw-badge" aria-hidden="true">🏙️ 東京、歩く。</p>

    <!-- タイトル -->
    <section class="tw-title" aria-labelledby="tw-heading">
      <div class="tw-title-card">
        <h1 class="tw-heading" id="tw-heading">東京、歩く。</h1>
        <p class="tw-sub">東京を、ただ歩いてみる。</p>
        <button class="tw-start" id="tw-start" type="button" disabled>読み込み中…</button>
        <ul class="tw-howto">
          <li class="tw-howto-touch">左下で移動・右下でジャンプ・右側をなぞって見回す</li>
          <li class="tw-howto-pc">WASD / 矢印キーで移動・Spaceでジャンプ・Q/Eで見回す</li>
        </ul>
        <p class="tw-error" id="tw-error" role="alert" hidden>
          3D表示の準備ができませんでした。<br>通信状況を確認して、ページを再読み込みしてください。
        </p>
      </div>
    </section>

    <!-- 操作（スマホ） -->
    <div class="tw-look" id="tw-look" aria-hidden="true"></div>
    <div class="tw-joy-zone" id="tw-joy-zone" aria-hidden="true">
      <div class="tw-joy" id="tw-joy"><div class="tw-joy-knob" id="tw-joy-knob"></div></div>
    </div>
    <button class="tw-jump" id="tw-jump" type="button" aria-label="ジャンプ">JUMP</button>

    <p class="tw-hint" id="tw-hint" aria-hidden="true"></p>
  </div>

  <script src="engine.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>

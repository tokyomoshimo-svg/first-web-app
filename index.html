<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff6b6b">
  <meta name="description" content="1〜3分で遊べる、くだらないミニゲーム集。">
  <title>ちょっと暇つぶし。</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
  <link rel="stylesheet" href="assets/common.css">
  <link rel="stylesheet" href="assets/top.css">
</head>
<body>
  <main class="page">
    <header class="top-hero">
      <div class="top-logo" aria-hidden="true">☕</div>
      <h1 class="top-title">ちょっと暇つぶし。</h1>
      <p class="top-sub">1〜3分で遊べる、くだらないミニゲーム集。</p>
    </header>

    <section aria-labelledby="games-title">
      <h2 id="games-title" class="section-title">あそべるゲーム</h2>
      <ul id="game-list" class="game-list"></ul>
      <noscript>
        <p class="disclaimer">このサイトを遊ぶには JavaScript を有効にしてください。</p>
      </noscript>
    </section>

    <footer class="top-footer">
      <p>ログイン不要・無料。ひまなときにどうぞ。</p>
    </footer>
  </main>

  <script src="assets/games.js"></script>
  <script>
    (() => {
      const list = document.getElementById("game-list");

      GAMES.forEach((game, i) => {
        const li = document.createElement("li");
        li.className = "game-card";
        li.style.setProperty("--card-color", game.color);
        li.style.animationDelay = i * 80 + "ms";

        const icon = document.createElement("div");
        icon.className = "game-icon";
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = game.emoji;

        const body = document.createElement("div");
        body.className = "game-body";

        const title = document.createElement("h3");
        title.className = "game-title";
        title.textContent = game.title;

        const desc = document.createElement("p");
        desc.className = "game-desc";
        desc.textContent = game.description;

        const meta = document.createElement("p");
        meta.className = "game-meta";
        meta.textContent = "⏱ " + game.time;

        const play = document.createElement("a");
        play.className = "btn btn-primary game-play";
        play.href = game.href;
        play.textContent = "遊ぶ";
        play.setAttribute("aria-label", game.title + "を遊ぶ");

        body.append(title, desc, meta);
        li.append(icon, body, play);
        list.appendChild(li);
      });

      const soon = document.createElement("li");
      soon.className = "game-card is-soon";
      soon.innerHTML = '<div class="game-icon" aria-hidden="true">🛠</div>' +
        '<div class="game-body"><h3 class="game-title">次のゲーム</h3>' +
        '<p class="game-desc">鋭意（ゆるく）制作中…</p></div>';
      list.appendChild(soon);
    })();
  </script>
</body>
</html>
